# SYK-CORRIDOR v3 Nebius instance spec (PREREG v3 s6: single cheapest-adequate CPU node)
metadata:
  parent_id: project-e00v3avmpr00fzcxq8s6x7
  name: syk-corridor-v3
spec:
  resources:
    platform: cpu-d3
    preset: 32vcpu-128gb
  network_interfaces:
    - subnet_id: vpcsubnet-e00xmeefedj1pdqg78
      name: eth0
      ip_address: {}
      public_ip_address: {}
  boot_disk:
    attach_mode: READ_WRITE
    managed_disk:
      name: syk-corridor-v3-boot
      spec:
        size_gibibytes: "64"
        type: NETWORK_SSD
        source_image_family:
          image_family: ubuntu24.04-driverless
  cloud_init_user_data: |
    #cloud-config
    users:
      - name: aukora
        groups: sudo
        sudo: ['ALL=(ALL) NOPASSWD:ALL']
        shell: /bin/bash
        ssh_authorized_keys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIUwibS4vcZRnFZ+h5HY6WQ/JmQ1hgFkkU9PRtR0icyV aukora-lab-20260729
    packages:
      - python3-numpy
